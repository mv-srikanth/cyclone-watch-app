name: Build iOS app

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project CycloneWatch.xcodeproj -target CycloneWatch \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CycloneWatch.app Payload/
          zip -qry CycloneWatch-unsigned.ipa Payload
          ls -lh CycloneWatch-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CycloneWatch-ios-unsigned-ipa
          path: ios/CycloneWatch-unsigned.ipa
